<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="goaSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goaSand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="340" fill="url(#goaSky)"/>

  <!-- Golden Setting Sun -->
  <circle cx="400" cy="230" r="55" fill="#fef08a" opacity="0.95"/>
  <circle cx="400" cy="230" r="75" fill="#fef08a" opacity="0.25"/>

  <!-- Arabian Sea -->
  <rect y="270" width="800" height="90" fill="url(#goaSea)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="400" cy="285" rx="45" ry="4" fill="#fef08a" opacity="0.7"/>
  <ellipse cx="400" cy="300" rx="35" ry="3" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="400" cy="315" rx="55" ry="4" fill="#fef08a" opacity="0.5"/>
  <ellipse cx="400" cy="330" rx="25" ry="2" fill="#fef08a" opacity="0.4"/>

  <!-- Foamy Surf Line -->
  <path d="M0 350 Q200 345 400 352 Q600 348 800 350 L800 360 L0 360 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Golden Beach Sand -->
  <path d="M0 355 Q250 350 500 358 Q650 355 800 358 L800 500 L0 500 Z" fill="url(#goaSand)"/>

  <!-- Left Swaying Palm Tree -->
  <g transform="translate(100, 360)">
    <!-- Trunk -->
    <path d="M0 0 Q40 -120 70 -230" stroke="#78350f" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M4 0 Q44 -120 72 -230" stroke="#451a03" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Palm Fronds -->
    <!-- Frond 1 Left -->
    <path d="M70 -230 Q20 -250 -20 -220" stroke="#15803d" stroke-width="5" fill="none"/>
    <path d="M70 -230 Q10 -270 -40 -260" stroke="#166534" stroke-width="5" fill="none"/>
    <!-- Frond 2 Top -->
    <path d="M70 -230 Q80 -300 90 -310" stroke="#15803d" stroke-width="5" fill="none"/>
    <path d="M70 -230 Q120 -290 140 -280" stroke="#166534" stroke-width="5" fill="none"/>
    <!-- Frond 3 Right -->
    <path d="M70 -230 Q140 -250 180 -220" stroke="#15803d" stroke-width="5" fill="none"/>
    <path d="M70 -230 Q130 -220 160 -190" stroke="#166534" stroke-width="4.5" fill="none"/>
    <!-- Coconuts -->
    <circle cx="68" cy="-225" r="7" fill="#78350f"/>
    <circle cx="78" cy="-223" r="6.5" fill="#451a03"/>
    <circle cx="73" cy="-218" r="6" fill="#78350f"/>
  </g>

  <!-- Right Palm Tree -->
  <g transform="translate(720, 370)">
    <path d="M0 0 Q-30 -100 -50 -210" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-50 -210 Q-120 -230 -140 -200" stroke="#15803d" stroke-width="4.5" fill="none"/>
    <path d="M-50 -210 Q-80 -270 -60 -285" stroke="#166534" stroke-width="4.5" fill="none"/>
    <path d="M-50 -210 Q-10 -260 20 -240" stroke="#15803d" stroke-width="4.5" fill="none"/>
    <path d="M-50 -210 Q10 -220 40 -190" stroke="#166534" stroke-width="4" fill="none"/>
  </g>

  <!-- Beach Parasol & Sunbed -->
  <g transform="translate(480, 410)">
    <!-- Umbrella Pole -->
    <line x1="0" y1="0" x2="-10" y2="-90" stroke="#94a3b8" stroke-width="4"/>
    <!-- Umbrella Canopy (Striped) -->
    <path d="M-65 -90 Q-10 -130 45 -90 Z" fill="#ef4444"/>
    <path d="M-40 -90 Q-10 -130 20 -90 Z" fill="#ffffff"/>
    <path d="M-20 -90 Q-10 -130 0 -90 Z" fill="#ef4444"/>
    
    <!-- Sunbed / Lounge Chair -->
    <polygon points="-80,20 -15,10 0,22 -65,30" fill="#38bdf8"/>
    <line x1="-70" y1="20" x2="-75" y2="35" stroke="#64748b" stroke-width="3"/>
    <line x1="-10" y1="12" x2="-8" y2="30" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- Flying Coastal Seagulls -->
  <path d="M260 160 Q270 150 280 160 Q290 150 300 160" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M305 180 Q313 172 321 180 Q329 172 337 180" stroke="#334155" stroke-width="1.8" fill="none"/>
</svg>

