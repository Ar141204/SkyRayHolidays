<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="sl_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#408bbd"/>
      <stop offset="60%" stop-color="#80c3d9"/>
      <stop offset="100%" stop-color="#fcedc7"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="520" fill="url(#sl_sky)"/>
  <circle cx="680" cy="110" r="45" fill="#fff7d6" opacity="0.9"/>
  <!-- Sigiriya Rock Fortress Silhouette in distance -->
  <path d="M260 270 Q280 200 340 180 H460 Q520 200 540 270 L580 320 H220 Z" fill="#755a43"/>
  <rect x="330" y="175" width="140" height="15" rx="3" fill="#8c6d54"/>
  <!-- Misty Tea Country Rolling Terraces -->
  <path d="M0 290 Q220 240 450 280 T800 260 V520 H0 Z" fill="#2d6e4b"/>
  <path d="M0 340 Q250 300 520 340 T800 310 V520 H0 Z" fill="#215438"/>
  <path d="M0 390 Q200 360 460 400 T800 370 V520 H0 Z" fill="#18422b"/>
  <!-- Tea Plantation Contour Lines -->
  <g stroke="#3a8a5e" stroke-width="3" opacity="0.4" fill="none">
    <path d="M40 320 Q240 280 480 310 T780 290"/>
    <path d="M20 370 Q260 330 540 365 T790 340"/>
    <path d="M0 420 Q220 390 500 425 T800 395"/>
  </g>
  <!-- Sri Lankan Elephant Silhouette in Foreground -->
  <g fill="#1b2a26" transform="translate(140, 370) scale(0.65)">
    <!-- Elephant Body -->
    <ellipse cx="140" cy="90" rx="75" ry="55"/>
    <!-- Head -->
    <circle cx="60" cy="70" r="40"/>
    <!-- Trunk -->
    <path d="M40 80 Q10 100 15 140 Q22 155 30 145 Q25 125 45 105 Z"/>
    <!-- Ear -->
    <ellipse cx="75" cy="70" rx="22" ry="30"/>
    <!-- Tusk -->
    <path d="M35 100 Q15 110 5 105 Q15 95 35 90 Z" fill="#fdfcf0"/>
    <!-- Legs -->
    <rect x="85" y="125" width="22" height="60" rx="6"/>
    <rect x="120" y="125" width="20" height="55" rx="6"/>
    <rect x="165" y="125" width="22" height="60" rx="6"/>
    <rect x="195" y="125" width="18" height="55" rx="6"/>
    <!-- Tail -->
    <path d="M210 85 Q225 110 220 140" stroke="#1b2a26" stroke-width="5" fill="none"/>
  </g>
</svg>
