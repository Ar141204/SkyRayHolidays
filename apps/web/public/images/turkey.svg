<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="turkeySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="balloonGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="balloonGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#turkeySky)"/>

  <!-- Sun -->
  <circle cx="680" cy="320" r="45" fill="#fef08a" opacity="0.9"/>

  <!-- Distant Anatolian Mountains -->
  <polygon points="0,370 120,310 240,360 400,280 560,370 800,310 800,500 0,500" fill="#94a3b8" opacity="0.4"/>
  <polygon points="60,380 200,320 360,390 520,330 680,380 800,350 800,500 0,500" fill="#64748b" opacity="0.5"/>

  <!-- Cappadocia Fairy Chimneys (Rock Formations) -->
  <path d="M0 450 Q80 430 160 450 L160 500 L0 500 Z" fill="#b45309" opacity="0.7"/>
  
  <!-- Chimney 1 -->
  <path d="M120 500 L125 410 Q130 380 145 375 Q160 380 165 410 L170 500 Z" fill="#92400e"/>
  <ellipse cx="145" cy="375" rx="22" ry="10" fill="#78350f"/>

  <!-- Chimney 2 (Large central) -->
  <path d="M260 500 L275 380 Q285 340 310 335 Q335 340 345 380 L360 500 Z" fill="#78350f"/>
  <ellipse cx="310" cy="335" rx="35" ry="14" fill="#451a03"/>
  <!-- Windows carved in rock -->
  <rect x="298" y="380" width="8" height="12" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <rect x="314" y="380" width="8" height="12" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <rect x="306" y="415" width="10" height="16" rx="5" fill="#1e1b4b" opacity="0.8"/>

  <!-- Chimney 3 -->
  <path d="M480 500 L490 400 Q495 365 515 360 Q535 365 540 400 L550 500 Z" fill="#92400e"/>
  <ellipse cx="515" cy="360" rx="26" ry="11" fill="#78350f"/>

  <!-- Chimney 4 -->
  <path d="M680 500 L690 420 Q695 390 710 385 Q725 390 730 420 L740 500 Z" fill="#b45309"/>
  <ellipse cx="710" cy="385" rx="20" ry="9" fill="#78350f"/>

  <!-- Hot Air Balloons Floating -->
  <!-- Balloon 1 (Hero Large Left) -->
  <g transform="translate(180, 110)">
    <!-- Balloon Body -->
    <path d="M 0 0 C -45 -10 -55 -60 -35 -95 C -15 -130 15 -130 35 -95 C 55 -60 45 -10 0 0 Z" fill="url(#balloonGrad1)"/>
    <ellipse cx="0" cy="-65" rx="14" ry="45" fill="#ffffff" opacity="0.3"/>
    <!-- Basket Ropes & Basket -->
    <line x1="-12" y1="0" x2="-8" y2="15" stroke="#475569" stroke-width="2"/>
    <line x1="12" y1="0" x2="8" y2="15" stroke="#475569" stroke-width="2"/>
    <rect x="-10" y="15" width="20" height="14" rx="2" fill="#78350f"/>
  </g>

  <!-- Balloon 2 (Mid Right) -->
  <g transform="translate(480, 160)">
    <path d="M 0 0 C -35 -8 -42 -45 -27 -75 C -12 -100 12 -100 27 -75 C 42 -45 35 -8 0 0 Z" fill="url(#balloonGrad2)"/>
    <ellipse cx="0" cy="-52" rx="10" ry="36" fill="#ffffff" opacity="0.3"/>
    <line x1="-9" y1="0" x2="-6" y2="12" stroke="#475569" stroke-width="1.5"/>
    <line x1="9" y1="0" x2="6" y2="12" stroke="#475569" stroke-width="1.5"/>
    <rect x="-7" y="12" width="14" height="10" rx="2" fill="#78350f"/>
  </g>

  <!-- Balloon 3 (Small Distant Center) -->
  <g transform="translate(340, 200)">
    <path d="M 0 0 C -20 -5 -25 -28 -16 -45 C -7 -60 7 -60 16 -45 C 25 -28 20 -5 0 0 Z" fill="#0284c7"/>
    <line x1="-5" y1="0" x2="-3" y2="8" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="0" x2="3" y2="8" stroke="#475569" stroke-width="1"/>
    <rect x="-4" y="8" width="8" height="6" rx="1" fill="#78350f"/>
  </g>

  <!-- Balloon 4 (Distant High Right) -->
  <g transform="translate(620, 80)">
    <path d="M 0 0 C -25 -6 -30 -35 -20 -55 C -9 -75 9 -75 20 -55 C 30 -35 25 -6 0 0 Z" fill="#f59e0b"/>
    <line x1="-6" y1="0" x2="-4" y2="9" stroke="#475569" stroke-width="1"/>
    <line x1="6" y1="0" x2="4" y2="9" stroke="#475569" stroke-width="1"/>
    <rect x="-5" y="9" width="10" height="7" rx="1" fill="#78350f"/>
  </g>

  <!-- Birds -->
  <path d="M420 120 Q428 112 436 120 Q444 112 452 120" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M450 135 Q456 128 462 135 Q468 128 474 135" stroke="#334155" stroke-width="1.5" fill="none"/>
</svg>
